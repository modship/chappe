[package]
name = "chappe"
version = "0.2.0"
description = "Cross-platform terminal and SSH client"
authors = ["Modship"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chappe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
sys-locale = "0.3.2"
tauri-plugin-clipboard-manager = "2"
tokio = { version = "1.54.1", features = ["full"] }
ssh2-config = "0.9.0"
dirs = "7.0.0"
anyhow = "1.0.104"
tauri-plugin-dialog = "2"
uuid = { version = "1.29.0", features = ["v4"] }
russh = { version = "0.65.0", default-features = false, features = ["ring", "rsa", "flate2"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
russh-sftp = "3.0.1"
trash = "5.2.9"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
