name: Release

# Pushing a tag such as v0.3.0 builds signed installers for every platform
# and attaches them to a draft GitHub release, with the latest.json the
# in-app updater reads. Publishing the draft makes the update available.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check the release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the updater key and the version
        shell: bash
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          pubkey=$(jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json)
          if [ -z "$pubkey" ] || [ "$pubkey" = "null" ]; then
            echo "::error::plugins.updater.pubkey is empty in src-tauri/tauri.conf.json. See 'Releases and updates' in the README."
            exit 1
          fi
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing."
            exit 1
          fi
          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match version ${version} in src-tauri/tauri.conf.json."
            exit 1
          fi
          for file in package.json; do
            other=$(jq -r '.version' "$file")
            [ "$other" = "$version" ] || { echo "::error::$file has version $other, tauri.conf.json has $version."; exit 1; }
          done
          cargo_version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          [ "$cargo_version" = "$version" ] || { echo "::error::Cargo.toml has version $cargo_version, tauri.conf.json has $version."; exit 1; }

  build:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            target: ""
          - name: Windows
            os: windows-latest
            target: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build, sign and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Chappe v__VERSION__
          releaseBody: |
            Download the installer for your system below. Chappe already installed? It offers this version itself.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: >-
            --config src-tauri/tauri.release.conf.json
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
